<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crear cuenta | Clima</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head>
<body><main class="page"><section class="auth-card"><p class="eyebrow">Clima personal</p><h1>Crear cuenta</h1><p class="intro-copy">Guarda tu acceso de forma segura.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="message {{ category }}" role="alert">{{ message }}</p>{% endfor %}{% endwith %}<form class="auth-form" method="post"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required><label for="password">Contraseña</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><small>Usa al menos 8 caracteres.</small><button type="submit">Crear cuenta</button></form><p class="auth-footer">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p></section></main></body></html>
