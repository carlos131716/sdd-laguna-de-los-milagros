<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión | Clima</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head>
<body><main class="page"><section class="auth-card"><p class="eyebrow">Clima personal</p><h1>Iniciar sesión</h1><p class="intro-copy">Accede para consultar el clima.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="message {{ category }}" role="alert">{{ message }}</p>{% endfor %}{% endwith %}<form class="auth-form" method="post"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button></form><p class="auth-footer">¿No tienes cuenta? <a href="{{ url_for('register') }}">Crear cuenta</a></p></section></main></body></html>
